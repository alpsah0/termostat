<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1419">
<title>Termostat</title>
<style>
:root{
  --bg:#0F1419; --surface:#1A212B; --surface2:#252E3A; --line:#2B3440; --line2:#5B6678;
  --text:#F2F5F8; --muted:#A3AFBD; --orange:#FF8A3D; --orange-bg:#2B2118; --amber:#FFB020;
  --blue:#4DA3FF; --green:#3DDC97; --red:#E5484D; --red-soft:#FF6B6B; --gray:#7F8B99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));overflow-y:auto}
.hdr{display:flex;align-items:center;gap:4px;min-height:44px;flex:none}
.hdr h1{margin:0;font-size:22px;font-weight:600;flex:1}
.iconbtn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;border-radius:12px}
.hdr .back{margin-left:-10px}
.sub{font-size:13px;color:var(--muted);margin:2px 0 -6px}
.card{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
/* strip */
.strip{display:flex;align-items:center;height:44px;flex:none}
.strip .menu{margin-left:-10px}
.pill{margin-left:8px;width:64px;height:36px;border-radius:18px;border:none;display:flex;align-items:center;justify-content:center;padding:0}
.pill.red{background:var(--red);color:#fff}.pill.yellow{background:var(--amber);color:#0F1419}.pill.gray{background:var(--line2);color:#fff}
.strip-r{margin-left:auto;display:flex;align-items:center;gap:16px}
.strip-r .iconbtn{width:28px;height:28px;border-radius:6px}
.slot{width:28px;height:28px}
.ind{display:flex;width:28px;height:28px}
/* dial */
.dial{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.dial svg{max-width:100%;height:auto}
.outdoor{background:var(--surface);border-radius:20px;height:72px;display:flex;align-items:center;justify-content:center;gap:22px;flex:none}
.outdoor .g{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:600}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.blink{animation:blink 1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.blink{animation:none;opacity:.5}}
/* overlays */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:20}
.drawer{position:absolute;top:0;bottom:0;left:0;width:290px;background:#151B23;padding:calc(28px + env(safe-area-inset-top)) 16px 28px;display:flex;flex-direction:column;gap:4px;z-index:21;overflow-y:auto}
.drawer .ttl{padding:8px 12px 20px}.drawer .ttl b{display:block;font-size:24px;font-weight:600}.drawer .ttl span{font-size:14px;color:var(--muted)}
.drawer button{height:56px;border:none;border-radius:14px;background:transparent;display:flex;align-items:center;gap:16px;padding:0 14px;font-size:18px;font-weight:500;text-align:left}
.drawer button.on{background:var(--orange-bg);color:var(--orange);font-weight:600}
.drawer hr{border:none;border-top:1px solid var(--surface2);margin:8px 12px}
.balloon{position:absolute;top:calc(72px + env(safe-area-inset-top));width:290px;max-width:calc(100% - 40px);border-radius:14px;padding:14px;z-index:10;border:1px solid transparent}
.balloon b{display:block;font-size:16px;font-weight:600}.balloon p{margin:4px 0 0;font-size:14px}
.balloon::before{content:"";position:absolute;top:-7px;width:12px;height:12px;transform:rotate(45deg);background:inherit;border-left:1px solid var(--bc);border-top:1px solid var(--bc)}
.balloon.red{background:#2B161A;--bc:var(--red);border-color:var(--red)}.balloon.red p{color:#D8BEC2}
.balloon.yellow{background:#2B2412;--bc:var(--amber);border-color:var(--amber)}.balloon.yellow p{color:#E6D8B4}
.balloon.gray,.balloon.info{background:#263041;--bc:#263041;border-color:#263041}.balloon.gray p,.balloon.info p{color:var(--muted)}
.balloon.left{left:20px}.balloon.left::before{left:62px}
.balloon.right{right:20px}.balloon.right.m::before{right:134px}.balloon.right.p::before{right:90px}
.balloon .act{margin-top:12px;height:44px;padding:0 20px;border-radius:12px;border:1.5px solid var(--red);background:transparent;font-size:15px;font-weight:600}
/* forms & lists */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.btn{height:56px;border:none;border-radius:28px;background:var(--orange);color:#0F1419;font-size:17px;font-weight:600;flex:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--text);height:44px;border-radius:12px;font-size:15px;font-weight:500;padding:0 16px}
.field{padding:5px 0;display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{height:46px;width:100%;background:var(--surface2);border:none;border-radius:12px;padding:0 14px;color:var(--text);font:inherit;font-size:16px}
.field textarea{height:auto;min-height:92px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
.field .pw{position:relative}.field .pw button{position:absolute;right:2px;top:1px;width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
.hint{font-size:12px;color:var(--muted);margin:-2px 0 2px 2px}
.switch{width:56px;height:32px;border:none;border-radius:16px;background:#3A4452;position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--orange)}.switch[aria-checked="true"]::after{left:27px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.menu-pop{align-self:flex-end;width:210px;background:var(--surface);border-radius:16px;padding:6px 0;margin-top:-4px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.menu-pop button{display:flex;align-items:center;gap:14px;width:100%;height:52px;padding:0 18px;border:none;background:transparent;font-size:17px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line2);background:transparent;font-size:14px}
.chip.on{background:var(--orange-bg);border-color:var(--orange);color:var(--orange);font-weight:600}
/* terminal */
.log{background:var(--surface);border-radius:14px;padding:10px 12px;height:260px;overflow-y:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.log div{padding:3px 0;border-bottom:1px solid var(--surface2)}.log .in{color:#9CC8FF}.log .out{color:var(--orange)}.log .sys{color:var(--muted)}.log .err{color:var(--red-soft)}
.log time{opacity:.6;margin-right:6px}

.tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:150px;gap:10px;flex:none}
.tile{border-radius:18px;background:var(--surface);border:2px solid transparent;padding:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;color:var(--text)}
.tile.on{background:var(--orange-bg);border-color:var(--orange);color:var(--orange)}
.tile b{display:block;font-size:19px;font-weight:600}.tile span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.stp{width:64px;height:64px;border:none;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.stp.s{width:44px;height:44px}.stp:disabled{opacity:.35;cursor:default}
.val{font-weight:600;text-align:center}
.pillsel{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line2);background:transparent;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.calrow{display:flex;align-items:center;justify-content:space-between;height:48px;border:none;background:transparent;padding:0;width:100%;text-align:left}
.timebtn{position:relative;height:44px;padding:0 16px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.timebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;padding:12px 20px calc(28px + env(safe-area-inset-bottom));z-index:21}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.sheet .opt{height:56px;display:flex;align-items:center;justify-content:space-between;font-size:17px;width:100%;background:none;border:none;border-bottom:1px solid var(--surface2);text-align:left}
.sheet .opt.on{color:var(--orange);font-weight:600}
.note{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.divider{height:1px;background:var(--surface2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(390px,calc(100% - 40px));bottom:calc(24px + env(safe-area-inset-bottom));background:#263041;border-radius:14px;padding:12px 14px;font-size:14px;z-index:40}
</style>
</head>

};
const rid = () => Math.random().toString(16).slice(2, 8);
function newBroker() {
  return {
    id: 'b' + Date.now().toString(36) + rid(), name: 'Adafruit IO', host: 'io.adafruit.com', ssl: true, port: 443, path: '/mqtt',
    auth: true, user: '', key: '',

    clientId: 'web_dashboard_' + rid(), cleanSession: true, keepAlive: 60, timeout: 30, autoConnect: true, showReconnect: true
  };
}
const store = {
  get(k, d) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* özel mod vb. */ } }
};
let cfg = store.get('termostat.cfg', null);
if (!cfg || !Array.isArray(cfg.brokers) || !cfg.brokers.length) { const b = newBroker(); cfg = { brokers: [b], active: b.id }; }
cfg.keys = Object.assign({}, DEFAULT_KEYS, cfg.keys || {});
cfg.staleMin = cfg.staleMin || 10;
const saveCfg = () => store.set('termostat.cfg', cfg);
const activeBroker = () => cfg.brokers.find(b => b.id === cfg.active) || cfg.brokers[0];

/* ---------- Durum ---------- */
const S = Object.assign({ v: {}, lastVeri: null }, store.get('termostat.state', {}));
S.conn = 'kapali'; S.connMsg = ''; S.demo = false; S.connectedAt = null; S.awaitGet = false; S.authError = false;
const saveState = () => store.set('termostat.state', { v: S.demo ? (store.get('termostat.state', { v: {} }).v || {}) : S.v, lastVeri: S.lastVeri, model: S.model || null });

function applyObj(o) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) return false;
  const K = cfg.keys; let any = false;
  for (const [name, k] of Object.entries(K)) if (k && Object.prototype.hasOwnProperty.call(o, k)) { S.v[name] = o[k]; any = true; }
  if (typeof o.aktif_profil === 'string' && !(K.profil in o)) { S.v.profil = { KONFOR: 0, EKONOMI: 1, GECE: 2 }[o.aktif_profil.toUpperCase()] ?? 3; any = true; }
  if ('master_sensor_kod' in o && !(cfg.keys.master_sensor_kodu in o)) { S.v.master_sensor_kodu = o.master_sensor_kod; any = true; }
  if ('slave_sensor_kod' in o && !(cfg.keys.slave_sensor_kodu in o)) { S.v.slave_sensor_kodu = o.slave_sensor_kod; any = true; }
  return any;
}
function topicFor(kind, b = activeBroker()) {
  const t = (b.topics[kind] ?? (kind === 'model' ? 'termostat-model' : '')).trim(); if (!t) return '';
  if (t.includes('/')) return t;
  return /adafruit/i.test(b.host) ? `${b.user}/feeds/${t}` : t;
}
const isAdafruit = (b = activeBroker()) => /adafruit/i.test(b.host);

/* ---------- Günlük (Terminal) ---------- */
const LOG = [];
function log(kind, topic, text) {

}
const hms = d => d.toTimeString().slice(0, 8);

/* ---------- Bağlantı (MQTT over WebSocket, Paho) ---------- */
let client = null, reconnectTimer = null, backoff = 0, lastAttempt = 0, manualStop = false;
function setConn(state, msg = '') { S.conn = state; S.connMsg = msg; if (state === 'bagli') S.connectedAt = Date.now(); redraw(); if (view().name === 'brokers') render(); }
function disconnect() {
  manualStop = true; clearTimeout(reconnectTimer);
  if (client) { try { client.onConnectionLost = () => { }; client.disconnect(); } catch (e) { } client = null; }
}
function connect() {
  clearTimeout(reconnectTimer);
  const b = activeBroker();
  if (client) { try { client.onConnectionLost = () => { }; client.disconnect(); } catch (e) { } client = null; }
  manualStop = false; S.authError = false;
  if (!b.host) return setConn('hata', 'Sunucu adı boş.');
  if (b.auth && (!b.user || !b.key)) return setConn('hata', 'Kullanıcı adı ve anahtar gerekli.');
  if (typeof Paho === 'undefined') return setConn('hata', 'MQTT kütüphanesi yüklenemedi.');
  lastAttempt = Date.now(); setConn('baglaniyor');
  const cid = (b.clientId || 'web_dashboard_' + rid());
  try {
    client = new Paho.Client(b.host, Number(b.port) || 443, b.path || '/mqtt', cid);
  } catch (e) { return setConn('hata', 'Bağlantı kurulamadı: ' + e.message); }
  client.onConnectionLost = r => {
    log('sys', '', 'Bağlantı koptu' + (r && r.errorMessage ? ': ' + r.errorMessage : ''));
    setConn('hata', 'Bağlantı koptu.'); scheduleReconnect();
  };
  client.onMessageArrived = m => onMessage(m.destinationName, m.payloadString);
  const opt = {
    useSSL: !!b.ssl, cleanSession: !!b.cleanSession, keepAliveInterval: Number(b.keepAlive) || 60, timeout: Number(b.timeout) || 30,
    onSuccess: onConnected,
    onFailure: e => {
      const msg = (e && e.errorMessage) || 'bilinmeyen hata';
      log('err', '', 'Bağlanamadı: ' + msg);
      if (/return code:\s*[45]/i.test(msg)) { S.authError = true; return setConn('hata', 'Kimlik doğrulanamadı. Kullanıcı adı ve anahtarı kontrol et.'); }
      setConn('hata', 'Bağlanamadı: ' + msg); scheduleReconnect();
    }
  };
  if (b.auth) { opt.userName = b.user; opt.password = b.key; }
  log('sys', '', `Bağlanılıyor: ${b.ssl ? 'wss' : 'ws'}://${b.host}:${b.port}${b.path || ''}`);
  try { client.connect(opt); } catch (e) { setConn('hata', 'Bağlantı kurulamadı: ' + e.message); }
}
function scheduleReconnect() {
  const b = activeBroker();
  if (manualStop || S.authError || !b.autoConnect) return;
  const wait = [5, 10, 20, 40, 60][Math.min(backoff++, 4)];
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, wait * 1000);
  log('sys', '', `${wait} sn sonra yeniden denenecek`);
}
function onConnected() {
  const b = activeBroker(); backoff = 0;
  log('sys', '', 'Bağlandı');
  setConn('bagli');
  const kinds = ['veri', 'durum', 'alarm', 'ayar', 'model'];
  /* Adafruit IO: geçersiz konuya abone olmak yasaklanmaya yol açar. Boş konular atlanır. */
  kinds.forEach(k => { const t = topicFor(k); if (t) { try { client.subscribe(t, { qos: 0 }); log('sys', t, 'abone olundu'); } catch (e) { log('err', t, e.message); } } });
  if (isAdafruit(b) && b.user) {
    ['errors', 'throttle'].forEach(x => { try { client.subscribe(`${b.user}/${x}`, { qos: 0 }); } catch (e) { } });
    S.awaitGet = true; setTimeout(() => { S.awaitGet = false; }, 4000);
    /* /get her seferinde 1 veri noktası sayılır (dakikada 30 sınırı). Bağlanınca bir kez istenir. */
    setTimeout(() => kinds.forEach(k => { const t = topicFor(k); if (t && client && client.isConnected()) { try { client.send(t + '/get', '0', 0, false); } catch (e) { } } }), 600);
    fetchLastCreatedAt(); fetchModelCreatedAt();
    setTimeout(() => syncNow(false), 2500);
  }
}
function fetchModelCreatedAt() {
  const b = activeBroker(), key = (b.topics.model ?? 'termostat-model').trim();
  if (!key || key.includes('/') || !b.user || !b.key) return;
  fetch(`https://io.adafruit.com/api/v2/${encodeURIComponent(b.user)}/feeds/${encodeURIComponent(key)}/data/last`, { headers: { 'X-AIO-Key': b.key } })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(d => { if (d && d.created_at) { const ts = Date.parse(d.created_at); if (S.model) { S.model.t = ts; saveState(); redraw(); } else S.pendingModelT = ts; } })
    .catch(() => { });
}
function fetchLastCreatedAt() {
  const b = activeBroker(), key = (b.topics.veri || '').trim();
  if (!key || key.includes('/') || !b.user || !b.key) return;
  fetch(`https://io.adafruit.com/api/v2/${encodeURIComponent(b.user)}/feeds/${encodeURIComponent(key)}/data/last`, { headers: { 'X-AIO-Key': b.key } })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(d => { if (d && d.created_at) { S.lastVeri = Date.parse(d.created_at); saveState(); log('sys', '', 'Son veri zamanı: ' + new Date(S.lastVeri).toLocaleString('tr-TR')); redraw(); } })
    .catch(e => log('sys', '', 'Son veri zamanı alınamadı (' + e.message + '). Canlı mesajlar beklenecek.'));
}
function onMessage(topic, text) {
  try { handleMessage(topic, text); } catch (e) { log('err', topic, 'Mesaj işlenemedi: ' + e.message); }
}
/* Öğrenme modülü: salt okunur, S.v'ye karışmaz (dis_sicaklik veri feed'indekini ezmesin) */
function modelFrom(o) {
  const K = cfg.keys, g = k => o[K['model_' + k] || k], n = x => (x === null || x === undefined || x === '' || !isFinite(Number(x))) ? null : Number(x);
  return { hazir: n(g('hazir')), ornek: n(g('ornek')), isi_kapasitesi: n(g('isi_kapasitesi')), isi_kaybi: n(g('isi_kaybi')), dis_sicaklik: n(g('dis_sicaklik')), fallback: n(g('fallback')) };
}
const DEMO_MODEL = { hazir: 1, ornek: 12, isi_kapasitesi: 0.18, isi_kaybi: 0.04, dis_sicaklik: 17.0, fallback: 0, t: Date.now() - 7 * 60000 };
const modelView = () => S.demo ? Object.assign({}, DEMO_MODEL, demoCur === 'slave' ? { fallback: 1 } : {}) : S.model;
function handleMessage(topic, text) {
  const b = activeBroker();
  const kind = ['veri', 'durum', 'alarm', 'ayar', 'model'].find(k => topicFor(k) === topic);
  const sys = /\/(errors|throttle)$/.test(topic);
  log(sys ? 'err' : 'in', topic, text);
  if (!kind) return;
  let o; try { o = JSON.parse(text); if (typeof o === 'string') o = JSON.parse(o); } catch (e) { log('err', topic, 'JSON okunamadı'); return; }
  if (kind === 'model') {
    if (o && typeof o === 'object') { const m = modelFrom(o); m.t = S.awaitGet ? (S.pendingModelT || (S.model && S.model.t) || null) : Date.now(); S.model = m; saveState(); redraw(); }
    return;
  }
  if (applyObj(o)) {
    afterMerge();
    if (kind === 'veri' && !S.awaitGet) S.lastVeri = Date.now();
    if (!S.awaitGet) liveArchive(kind);
    saveState(); redraw();
  }
}

/* ---------- Komut kuyruğu (dakikada en fazla 24 mesaj, Adafruit sınırı 30) ---------- */
const OUT = []; let outTimer = null;
function publish(kind, payload) {
  const t = topicFor(kind);
  if (!t) { toast('Bu konu tanımlı değil: ' + kind); return false; }
  if (S.demo) { log('out', t, payload + '  (demo, gönderilmedi)'); return true; }
  if (!client || !client.isConnected()) { toast('Bağlı değil, komut gönderilmedi.'); return false; }
  OUT.push({ t, payload }); pump(); return true;
}
const SENT = [];
function pump() {
  if (outTimer || !OUT.length) return;
  const now = Date.now(); while (SENT.length && now - SENT[0] > 60000) SENT.shift();
  if (SENT.length >= 24) { outTimer = setTimeout(() => { outTimer = null; pump(); }, 60000 - (now - SENT[0]) + 100); return; }
  const m = OUT.shift(); SENT.push(now);
  try { client.send(m.t, m.payload, 0, false); log('out', m.t, m.payload); } catch (e) { log('err', m.t, e.message); }
  outTimer = setTimeout(() => { outTimer = null; pump(); }, 200);
}
function sendCmd(obj) {
  const K = cfg.keys, o = {};
  for (const [name, val] of Object.entries(obj)) o[name === 'manuel_hedef' ? (K.hedef || 'hedef') : (K[name] || name)] = val;
  return publish('komut', JSON.stringify(o));
}

function dialSVG(v, A) {
  const flame = Number(v.kombi) === 1 && !(A && A.id === 'nodata'), lit = '#FF8A3D';
  const idx = x => Math.max(0, Math.min(54, Math.round((Number(x) - 5) / 25 * 54)));
  const deadRoom = !!(A && (A.blink === 'room' || A.blink === 'all')), deadAll = !!(A && A.blink === 'all');
  const cur = nv(v.oda_sicaklik) || deadRoom ? -1 : idx(v.oda_sicaklik);
  const mode = Number(v.mod), hasTgt = !nv(v.hedef) && mode !== 0 && !deadAll;
  const tgt = hasTgt ? idx(v.hedef) : -1;
  const room = '', tg = '';
  let s = `<svg width="350" height="300" viewBox="0 0 350 300" role="img" aria-label="İç sıcaklık ${deadRoom ? 'bilinmiyor' : f1(v.oda_sicaklik) + ' derece'}, nem ${nv(v.oda_nem) || deadRoom ? 'bilinmiyor' : 'yüzde ' + Math.round(v.oda_nem)}, hedef ${hasTgt ? f1(v.hedef) + ' derece' : 'yok'}">`;
  for (let i = 0; i < 55; i++) {
    const a = (135 + 5 * i) * Math.PI / 180, big = i === tgt;
    const r1 = big ? 118 : 128, r2 = big ? 160 : 152, col = big ? '#F2F5F8' : (i <= cur ? lit : '#2B3440');
    s += `<line x1="${(175 + r1 * Math.cos(a)).toFixed(1)}" y1="${(175 + r1 * Math.sin(a)).toFixed(1)}" x2="${(175 + r2 * Math.cos(a)).toFixed(1)}" y2="${(175 + r2 * Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${big ? 5 : 3.5}" stroke-linecap="round"/>`;
  }
  s += `<g transform="translate(155 62) scale(1.67)"><path d="${FLAME}" fill="${flame ? '#FF8A3D' : 'none'}" fill-opacity="${flame ? .28 : 1}" stroke="${flame ? '#FF8A3D' : '#6B7785'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>`;

  s += `<g${room}><text x="175" y="200" text-anchor="middle" font-size="76" font-weight="600" fill="#F2F5F8">${tx}<tspan font-size="30" font-weight="500" fill="#A3AFBD" dy="-30">°C</tspan></text>`;
  const hx = hasTgt ? [88, 114] : [140, 166];

  return s + '</svg>';
}

function termAppend(e) {

  const d = document.createElement('div'); d.className = e.kind;
  d.innerHTML = `<time>${hms(e.t)}</time>${e.topic ? esc(e.topic) + ' ' : ''}${esc(e.text)}`;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
  while (box.children.length > 300) box.firstChild.remove();
}
function termFill() {
  const box = $('#t-log'); if (!box) return; box.innerHTML = '';
  LOG.forEach(termAppend);
  const el = $('#t-stat'); if (el) el.textContent = S.demo ? 'Demo veri açık' : ({ bagli: 'Bağlı', baglaniyor: 'Bağlanıyor…', hata: 'Bağlı değil: ' + S.connMsg, kapali: 'Bağlı değil' }[S.conn]);
}

/* ---------- Komut yardımcıları (bekleyen değer + gecikmeli gönderim) ---------- */
const PEND = {}, PTIMER = {};
const val = n => { const p = PEND[n]; if (p && Date.now() - p.t < 12000) return p.v; if (p) delete PEND[n]; return S.v[n]; };
function setVal(n, v, delay = 1000) {
  if (S.demo) { S.v[n] = v; delete PEND[n]; sendCmd({ [n]: v }); render(); return; }
  PEND[n] = { v, t: Date.now() };
  clearTimeout(PTIMER[n]);
  const fire = () => { if (!sendCmd({ [n]: v })) { delete PEND[n]; render(); } };
  delay ? PTIMER[n] = setTimeout(fire, delay) : fire();
  render();
}
function stepVal(n, d, lo, hi, dec) {
  const cur = Number(val(n)); if (nv(val(n))) return toast('Değer cihazdan henüz gelmedi.');
  const k = Math.pow(10, dec), nx = Math.max(lo, Math.min(hi, Math.round((cur + d) * k) / k));
  if (nx !== cur) setVal(n, nx);
}
function afterMerge() { for (const n of Object.keys(PEND)) { const a = S.v[n], b = PEND[n].v; if (a === b || (!nv(a) && !nv(b) && Math.abs(Number(a) - Number(b)) < 0.05)) delete PEND[n]; } }
const sgn = (x, dec, unit) => nv(x) ? '—' : (Number(x) > 0 ? '+' : (Number(x) < 0 ? '−' : '')) + Math.abs(Number(x)).toFixed(dec) + unit;

/* ---------- Program ---------- */
const parseClock = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; };
function profCard(p, name, tKey, sKey) {
  const t = val(sKey), tv = parseClock(t), unknown = nv(val(tKey)) || tv === null, pr = PROFILES[p];
  const icon = p === 3 ? ic('moon', 24, '#F2F5F8', '#F2F5F8', 1) : ic(pr.i, 24, pr.c);
  return `<div class="card" style="padding:12px 14px;gap:4px"><div class="row" style="min-height:44px"><div style="display:flex;align-items:center;gap:10px">${icon}<span style="font-size:17px;font-weight:500">${name}</span></div>
<button class="timebtn" aria-label="${name} başlangıç saati" data-act="timeopen:${sKey}:${name}" ${tv === null ? 'disabled' : ''}>${ic('clock', 18, '#A3AFBD')}${tv === null ? '—' : hhmm(tv)}</button></div>
<div class="row" style="min-height:0">${stepBtn(name + ' sıcaklığını düşür', tKey, -0.1, 5, 30, 1, 'minus', '', unknown)}<span class="val" style="font-size:30px">${nv(val(tKey)) ? '—' : Number(val(tKey)).toFixed(1)}°</span>${stepBtn(name + ' sıcaklığını yükselt', tKey, 0.1, 5, 30, 1, 'plus', '', unknown)}</div></div>`;
}
ICON.clock = '<circle cx="12" cy="12" r="9"/>' + p('M12 7v5l3 2');
function timeline() {
  const L = [[parseClock(val('konfor_saat')), 1], [parseClock(val('ekonomi_saat')), 2], [parseClock(val('gece_saat')), 3]].filter(x => x[0] !== null).sort((a, b) => a[0] - b[0]);
  const W = 350, X = m => W * m / 1440, col = { 1: '#FFB020', 2: '#3DDC97', 3: '#5B6678' };
  let segs = [];
  L.forEach((s, i) => { const a = s[0], b = i + 1 < L.length ? L[i + 1][0] : L[0][0] + 1440; if (b <= 1440) segs.push([a, b, s[1]]); else { segs.push([a, 1440, s[1]]); if (L[0][0] > 0) segs.push([0, b - 1440, s[1]]); } });
  let s = `<svg width="100%" viewBox="0 0 ${W} 56" role="img" aria-label="24 saatlik program"><defs><clipPath id="bar"><rect x="0" y="6" width="${W}" height="30" rx="10"/></clipPath></defs><g clip-path="url(#bar)">`;
  segs.forEach(([a, b, p]) => { s += `<rect x="${X(a).toFixed(1)}" y="6" width="${(X(b) - X(a)).toFixed(1)}" height="30" fill="${col[p]}"/><line x1="${X(a).toFixed(1)}" y1="6" x2="${X(a).toFixed(1)}" y2="36" stroke="#0F1419" stroke-width="2"/>`; });
  s += '</g>';
  segs.forEach(([a, b, p]) => { if (X(b) - X(a) > 30) { const cx = (X(a) + X(b)) / 2 - 9; s += `<svg x="${cx.toFixed(1)}" y="12" width="18" height="18" viewBox="0 0 24 24" fill="${p === 3 ? '#F2F5F8' : 'none'}" stroke="${p === 3 ? '#F2F5F8' : '#0F1419'}" stroke-width="${p === 3 ? 1 : 2}" stroke-linecap="round" stroke-linejoin="round">${ICON[PROFILES[p].i]}</svg>`; } });
  const d = new Date(), now = X(d.getHours() * 60 + d.getMinutes());
  s += `<line x1="${now.toFixed(1)}" y1="2" x2="${now.toFixed(1)}" y2="40" stroke="#F2F5F8" stroke-width="3" stroke-linecap="round"/>`;
  [['00', 0, 'start'], ['06', 87.5, 'middle'], ['12', 175, 'middle'], ['18', 262.5, 'middle'], ['24', 350, 'end']].forEach(([l, x, a]) => s += `<text x="${x}" y="54" text-anchor="${a}" font-size="11" fill="#A3AFBD">${l}</text>`);
  return s + '</svg>';
}

/* ===================== Arşiv (IndexedDB), senkron, hesaplar ===================== */
const ARCH = { veri: [], durum: [], alarm: [] };

let idb = null, archReady = false;

function idbOpen() {
  return new Promise(res => {

function fmtDur(ms) { const m = Math.round(ms / 60000); return `${Math.floor(m / 60)} sa ${m % 60} dk`; }
function grafikHTML() {

<div style="display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:2px;flex:none">${Object.keys(RANGES).map(k => `<button class="chip ${G.range === k ? 'on' : ''}" style="flex:1;border-radius:10px;border-width:2px;border-color:${G.range === k ? 'var(--orange)' : 'transparent'};height:44px" aria-pressed="${G.range === k}" data-act="range:${k}">${k}</button>`).join('')}</div>

<div class="chips" style="flex:none">${[['temp', 'Sıcaklık'], ['hum', 'Nem']].map(([k, l]) => `<button class="chip ${G[k] ? 'on' : ''}" aria-pressed="${G[k]}" data-act="gtgl:${k}" style="display:flex;align-items:center;gap:6px">${G[k] ? ic('check', 18, '#FF8A3D') : ''}${l}</button>`).join('')}</div>
<div class="card" style="gap:10px"><div id="lg-t" style="font-size:13px;color:var(--muted)">&nbsp;</div><div style="display:flex;justify-content:space-between">${lgi('lg-os', '#FF8A3D', 'Oda')}${lgi('lg-tg', '#F2F5F8', 'Hedef', true)}${lgi('lg-ds', '#7F8B99', 'Dış')}${lgi('lg-on', '#4DA3FF', 'Oda nem')}</div>
<div id="gchart">${ch.svg}</div>${!ch.vs.length ? '<div class="note" role="status">' + ic('info', 20, '#A3AFBD') + '<span>Bu aralıkta veri yok</span></div>' : ''}
<div class="note" style="font-size:12px"><span style="width:18px;height:8px;border-radius:2px;background:#FF8A3D;display:inline-block"></span>Kombi yanıyor</div>
${ch.gaps.slice(0, 3).map(g => `<div class="note" style="color:#FFB020">${ic('warn', 18, '#FFB020')}${fD(g[0])}${fD(g[0]) === fD(g[1]) ? '' : ' – ' + fD(g[1])} arası veri yok</div>`).join('')}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${gstat('home', '#FF8A3D', 'İç sıcaklık', a1[0], a1[1], a1[2])}${gstat('suncloud', '#A3AFBD', 'Dış sıcaklık', a2[0], a2[1], a2[2])}${gstat('drop', '#4DA3FF', 'İç nem', a3[0], a3[1], a3[2])}
<div class="card" style="gap:4px;padding:12px 14px"><div style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)">${ic('flame', 20, '#FF8A3D')}Kombi çalışma</div><div style="font-size:30px;font-weight:600;line-height:36px">${ARCH.durum.length ? fmtDur(rt) : '—'}</div><div style="font-size:12px;color:var(--muted)">Toplam</div><div style="font-size:14px;font-weight:500;color:var(--muted)">${ARCH.durum.length ? 'Günde ort. ' + fmtDur(rt / days) : ''}</div></div></div>
<div class="card" style="gap:8px"><div class="row" style="min-height:0"><div style="display:flex;align-items:center;gap:10px">${ic('leaf', 24, '#3DDC97')}<span style="font-size:16px;font-weight:600">Tahmini tasarruf</span></div><button class="iconbtn" style="margin:-8px -10px -8px 0;color:var(--muted)" data-act="energy" aria-label="Tasarruf ayarları">${ic('gear', 22)}</button></div>
<div style="font-size:44px;font-weight:600;color:#3DDC97;line-height:48px;text-align:center">${sv ? '%' + Math.round(sv.pct) : '—'}</div>
<div style="background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;color:#D3DAE2;text-align:center">${sv ? esc(sumMsg(sv.pct)) : 'Tasarruf için en az bir günlük veri gerekli.'}</div>${cost ? `<div class="hint" style="margin:0;text-align:center">${esc(cost)}</div>` : ''}</div>
<div class="card" style="gap:10px"><div class="row" style="min-height:0"><div style="display:flex;align-items:center;gap:10px">${ic('archive', 24, '#A3AFBD')}<span style="font-size:16px;font-weight:600">Arşiv</span></div><span style="font-size:16px;font-weight:600">${archReady ? (nd ? nd + ' gün' : 'Boş') : 'Yükleniyor'}</span></div>
${busy ? `<div style="font-size:14px;color:var(--muted)">${esc(sy.msg)} · %${sy.pct}</div><div style="height:8px;border-radius:4px;background:#2B3440"><div style="width:${sy.pct}%;height:8px;border-radius:4px;background:var(--orange)"></div></div>` : `<div style="font-size:14px;color:var(--muted)">${sy.last ? 'Son senkron ' + fT(sy.last) + (new Date(sy.last).toDateString() === new Date().toDateString() ? '' : ' · ' + fD(sy.last)) : 'Henüz senkron yapılmadı'}</div>`}
${sy.err ? `<div class="note" style="color:#FFB020;font-size:13px">${ic('warn', 18, '#FFB020')}<span>${esc(sy.err)}</span></div>` : ''}
${nd && (csvAge === null || csvAge > 30) ? `<div class="note" style="font-size:13px">${ic('info', 18, '#A3AFBD')}<span>${csvAge === null ? 'Henüz CSV yedeği alınmadı.' : csvAge + ' gündür CSV yedeği alınmadı.'}</span></div>` : ''}
<div style="display:flex;gap:8px">${ab('sync', 'Güncelle', 'sync', busy)}${ab('download', 'CSV indir', 'csvdl', busy)}<label class="btn ghost" style="flex:1;height:64px;border-radius:14px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:13px;cursor:pointer;${busy ? 'opacity:.4;pointer-events:none' : ''}">${ic('upload', 22)}CSV yükle<input id="csv-file" type="file" accept=".csv,text/csv" style="display:none"></label></div></div>
${ui.sheet === 'energy' ? energySheet() : ''}</div>`;
}
function energySheet() {
  const e = cfg.energy || {};
  return `<div class="scrim" data-act="sheetclose"></div><div class="sheet" role="dialog" aria-label="Tasarruf ayarları"><div class="grab"></div><div style="font-size:18px;font-weight:600;margin-bottom:6px">Tasarruf ayarları</div>
<div class="field"><label for="e-price">Gaz birim fiyatı (₺/m³)</label><input id="e-price" inputmode="decimal" value="${esc(e.price)}" placeholder="boş bırakılırsa ₺ hesaplanmaz"></div>

/* ---------- Çizim ve olaylar ---------- */
let lastView = '';
function render() {
  const v = view(), app = $('#app');
  const titles = {};
  let html;
  if (v.name === 'brokers') html = brokersHTML();
  else if (v.name === 'brokeredit') html = brokerEditHTML(v.arg);
  else if (v.name === 'terminal') html = termHTML();
  else if (v.name === 'grafik') html = grafikHTML();
  else if (v.name === 'kontrol') html = kontrolHTML();
  else if (v.name === 'program') html = programHTML();
  else if (v.name === 'sistem') html = sistemHTML();
  else if (v.name === 'kalibrasyon') html = kalibHTML();
  else if (titles[v.name]) html = stubHTML(titles[v.name]);
  else html = homeHTML();
  const old = $('.page'), sc = old && lastView === v.name ? old.scrollTop : 0;
  app.innerHTML = html;
  const pg = $('.page'); if (pg) pg.scrollTop = sc;
  lastView = v.name;
  if (v.name === 'terminal') termFill();
  if (v.name === 'grafik') grafikBind();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const i = el.dataset.act.indexOf(':'), act = i < 0 ? el.dataset.act : el.dataset.act.slice(0, i), arg = i < 0 ? '' : el.dataset.act.slice(i + 1);
  switch (act) {
    case 'menu': ui.menu = true; ui.balloon = null; render(); break;
    case 'close': ui.menu = false; ui.balloon = null; render(); break;
    case 'go': ui.menu = false; ui.balloon = null; go(arg); break;
    case 'back': go({ brokeredit: 'brokers', kalibrasyon: 'sistem' }[view().name] || 'home'); break;
    case 'balloon': ui.balloon = ui.balloon === arg ? null : arg; render(); break;
    case 'reset': sendCmd({ reset: 1 }); ui.balloon = null; render(); toast('Sıfırlama komutu gönderildi.'); break;
    case 'bmenu': ui.brokerMenu = ui.brokerMenu === arg ? null : arg; render(); break;
    case 'bedit': ui.brokerMenu = null; go('brokeredit/' + arg); break;
    case 'bconn': {
      ui.brokerMenu = null;
      if (cfg.active === arg && S.conn === 'bagli') { disconnect(); setConn('kapali'); }
      else { cfg.active = arg; saveCfg(); if (S.demo) demoStop(); backoff = 0; connect(); }
      render(); break;
    }
    case 'bdel': {
      ui.brokerMenu = null;
      if (cfg.brokers.length > 1 && confirm('Bu broker silinsin mi?')) {
        const wasActive = cfg.active === arg; cfg.brokers = cfg.brokers.filter(b => b.id !== arg);
        if (wasActive) { disconnect(); cfg.active = cfg.brokers[0].id; setConn('kapali'); }
        saveCfg();
      }
      render(); break;
    }
    case 'badd': { const b = newBroker(); b.name = 'Yeni broker'; cfg.brokers.push(b); saveCfg(); go('brokeredit/' + b.id); break; }
    case 'demotoggle': S.demo ? demoStop() : demoStart('normal'); break;
    case 'demo': demoStart(arg); break;
    case 'tgl': el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true'); break;
    case 'eye': { const f = $('#f-key'); f.type = f.type === 'password' ? 'text' : 'password'; break; }
    case 'bsave': saveBroker(arg); break;
    case 'tclear': LOG.length = 0; termFill(); break;
    case 'tsend': {
      const txt = $('#t-msg').value.trim(); if (!txt) return toast('Mesaj boş.');
      let o; try { o = JSON.parse(txt); } catch (err) { return toast('Geçerli bir JSON değil: ' + err.message); }
      publish($('#t-to').value, JSON.stringify(o)); break;
    }
    case 'keyssave': {
      let o; try { o = JSON.parse($('#t-keys').value); } catch (err) { return toast('Geçerli bir JSON değil: ' + err.message); }
      if (!o || typeof o !== 'object' || Array.isArray(o) || Object.values(o).some(x => typeof x !== 'string')) return toast('Her değer bir metin olmalı.');
      cfg.keys = Object.assign({}, DEFAULT_KEYS, o); saveCfg(); toast('Alan eşlemesi kaydedildi.'); break;
    }
    case 'mode': setVal('mod', Number(arg), 0); break;
    case 'step': { const [n, d, lo, hi, dec] = arg.split(':'); stepVal(n, Number(d), Number(lo), Number(hi), Number(dec)); break; }
    case 'sheet': ui.sheet = arg; render(); break;
    case 'timeopen': { const [key, name] = arg.split(':'), c = parseClock(val(key)); if (c === null) break; ui.tp = { key, name, h: Math.floor(c / 60), m: c % 60 }; ui.sheet = 'time'; render(); break; }
    case 'timesave': { const h = Number($('#tp-h').value), m = Number($('#tp-m').value), key = ui.tp && ui.tp.key; ui.sheet = null; ui.tp = null; if (key) setVal(key, `${h}:${String(m).padStart(2, '0')}`, 0); else render(); break; }
    case 'sheetclose': ui.sheet = null; render(); break;
    case 'pick': { const j = arg.lastIndexOf(':'); ui.sheet = null; setVal(arg.slice(0, j), Number(arg.slice(j + 1)), 0); break; }
    case 'pwtoggle': setVal('pencere_koruma', Number(val('pencere_koruma')) === 1 ? 0 : 1, 0); break;
    case 'range': G.range = arg; G.off = 0; render(); break;
    case 'gprev': G.off++; render(); break;
    case 'gnext': if (G.off > 0) { G.off--; render(); } break;
    case 'gtgl': G[arg] = !G[arg]; render(); break;
    case 'sync': syncNow(true); break;
    case 'csvdl': downloadCSV(); render(); break;
    case 'energy': ui.sheet = 'energy'; render(); break;
    case 'energysave': { const g = i => $('#' + i).value.trim().replace(',', '.'); cfg.energy = { price: g('e-price'), m3h: g('e-m3h'), ref: g('e-ref') }; saveCfg(); ui.sheet = null; render(); toast('Kaydedildi.'); break; }
    case 'keysreset': cfg.keys = Object.assign({}, DEFAULT_KEYS); saveCfg(); render(); toast('Varsayılana dönüldü.'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t && t.id === 'csv-file' && t.files && t.files[0]) {
    t.files[0].text().then(tx => { try { const n = csvImport(tx); toast(n ? `${n} kayıt içe aktarıldı.` : 'Dosyada geçerli kayıt bulunamadı.'); } catch (err) { toast('CSV okunamadı: ' + err.message); } render(); });
    return;
  } if (t && ui.tp && (t.id === 'tp-h' || t.id === 'tp-m')) { ui.tp[t.id === 'tp-h' ? 'h' : 'm'] = Number(t.value); return; }

window.addEventListener('hashchange', () => { ui.sheet = null; ui.menu = false; ui.balloon = null; ui.brokerMenu = null; render(); if (view().name === 'grafik' && (!S.sync.last || Date.now() - S.sync.last > 120000)) syncNow(false); });
document.addEventListener('visibilitychange', () => {
  const b = activeBroker();
  if (!document.hidden && !S.demo && S.conn !== 'bagli' && S.conn !== 'baglaniyor' && b.autoConnect && !S.authError && Date.now() - lastAttempt > 5000 && canConnect(b)) { backoff = 0; connect(); }
});
setInterval(() => { const n = view().name; if (n === 'home') render(); else if (n === 'terminal') { const el = $('#t-stat'); if (el) el.textContent = S.demo ? 'Demo veri açık' : ({ bagli: 'Bağlı', baglaniyor: 'Bağlanıyor…', hata: 'Bağlı değil: ' + S.connMsg, kapali: 'Bağlı değil' }[S.conn]); } }, 30000);

/* ---------- Başlat ---------- */
render();
archInit();
setInterval(() => syncNow(false), 15 * 60000);
{
  const b = activeBroker();
  if (b.autoConnect && canConnect(b)) connect();
  else if (!canConnect(b)) setTimeout(() => toast('Başlamak için Broker sayfasından Adafruit IO kullanıcı adı ve anahtarını gir, ya da Demo’yu aç.'), 600);
}
